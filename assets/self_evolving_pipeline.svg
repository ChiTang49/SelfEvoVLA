    <rect x="295" y="145" width="225" height="105" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="407" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">RIPT 后训练</text><text x="407" y="218" text-anchor="middle" font-size="16" fill="#64748b">RLOO · 有界采样</text>
    <rect x="565" y="145" width="240" height="105" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="685" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">交互数据</text><text x="685" y="218" text-anchor="middle" font-size="16" fill="#64748b">成功与失败动作块</text>
    <rect x="850" y="145" width="250" height="105" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="975" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">结果价值模型</text><text x="975" y="218" text-anchor="middle" font-size="16" fill="#64748b">轻量 Q 代理</text>
    <rect x="1145" y="145" width="295" height="105" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="1292" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">候选动作规划</text><text x="1292" y="218" text-anchor="middle" font-size="16" fill="#64748b">评估 K 个动作块</text>
