  <rect x="60" y="500" width="20" height="20" rx="4" fill="#eff6ff" stroke="#3b82f6"/><text x="92" y="516" font-family="Droid Sans Fallback,DejaVu Sans" font-size="16" fill="#334155">本项目新增：结果价值排序与有界自训练回流</text>
  <text x="60" y="565" font-family="Droid Sans Fallback,DejaVu Sans" font-size="15" fill="#64748b">同时保留正负结果。结果价值排序不是精确 Bellman Q，也不是模型预测 rollout。</text>
