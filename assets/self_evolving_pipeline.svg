    <rect x="700" y="330" width="300" height="105" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="850" y="370" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">受控评估</text><text x="850" y="403" text-anchor="middle" font-size="16" fill="#64748b">K=1/4/8 · 留出状态</text>
    <rect x="255" y="330" width="300" height="105" rx="15" fill="#fff" stroke="#cbd5e1"/><text x="405" y="370" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">一轮经验回流</text><text x="405" y="403" text-anchor="middle" font-size="16" fill="#64748b">仅验证成功轨迹</text>
