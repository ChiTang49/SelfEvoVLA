  <rect width="1500" height="610" rx="24" fill="#f8fafc"/>
  <text x="58" y="58" font-family="Droid Sans Fallback,DejaVu Sans" font-size="29" font-weight="700" fill="#0f172a">自进化 VLA：后训练、规划与验证回流</text>
