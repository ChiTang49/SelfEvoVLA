<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="570" viewBox="0 0 1500 570" role="img" aria-labelledby="title desc">
  <title id="title">VLA 交互式后训练流程</title>
  <desc id="desc">SFT 初始权重、并行轨迹采样、留一法优势估计、有界动态采样、PPO 更新和固定状态评估。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".09"/></filter></defs>
  <rect width="1500" height="570" rx="24" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Droid Sans Fallback,DejaVu Sans" font-size="30" font-weight="700" fill="#0f172a">VLA 交互式后训练流程</text>
  <text x="60" y="98" font-family="Droid Sans Fallback,DejaVu Sans" font-size="17" fill="#64748b">稀疏二值奖励 · 单卡 LIBERO-Long 实验</text>
  <g filter="url(#shadow)" font-family="Droid Sans Fallback,DejaVu Sans">
    <rect x="60" y="170" width="190" height="135" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="155" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">SFT 初始权重</text><text x="155" y="244" text-anchor="middle" font-size="16" fill="#64748b">官方 QueST</text><text x="155" y="270" text-anchor="middle" font-size="16" fill="#64748b">策略初始化</text>
    <rect x="285" y="170" width="205" height="135" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="387" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">并行轨迹采样</text><text x="387" y="244" text-anchor="middle" font-size="16" fill="#64748b">每个状态 K=16</text><text x="387" y="270" text-anchor="middle" font-size="16" fill="#64748b">成功与失败轨迹</text>
    <rect x="525" y="170" width="215" height="135" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="632" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">组内优势估计</text><text x="632" y="244" text-anchor="middle" font-size="16" fill="#64748b">留一法</text><text x="632" y="270" text-anchor="middle" font-size="16" fill="#64748b">无需价值网络</text>
    <rect x="775" y="150" width="270" height="175" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="910" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">有界动态采样</text><text x="910" y="226" text-anchor="middle" font-size="16" fill="#475569">过滤零优势轨迹组</text><text x="910" y="255" text-anchor="middle" font-size="16" fill="#475569">限制重试并记录终止</text><text x="910" y="286" text-anchor="middle" font-size="16" fill="#475569">防止无效策略更新</text>
    <rect x="1080" y="170" width="165" height="135" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="1162" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">PPO 更新</text><text x="1162" y="244" text-anchor="middle" font-size="16" fill="#64748b">15 轮训练</text><text x="1162" y="270" text-anchor="middle" font-size="16" fill="#64748b">保存最终权重</text>
    <rect x="1280" y="170" width="165" height="135" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="1362" y="211" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">独立评估</text><text x="1362" y="244" text-anchor="middle" font-size="16" fill="#64748b">50 个固定状态</text><text x="1362" y="270" text-anchor="middle" font-size="16" fill="#64748b">成功率与成本</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M250 237 H278"/><path d="M490 237 H518"/><path d="M740 237 H768"/><path d="M1045 237 H1073"/><path d="M1245 237 H1273"/><path d="M1362 315 V390 H387 V313" stroke-dasharray="6 6"/></g>
  <text x="875" y="414" text-anchor="middle" font-family="Droid Sans Fallback,DejaVu Sans" font-size="16" fill="#64748b">交互 → 评价 → 更新 → 再次交互</text>
  <rect x="60" y="475" width="20" height="20" rx="4" fill="#eff6ff" stroke="#3b82f6"/><text x="92" y="491" font-family="Droid Sans Fallback,DejaVu Sans" font-size="16" fill="#334155">本项目：有界重试、诊断日志与受控评估</text>
  <rect x="795" y="475" width="20" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="827" y="491" font-family="Droid Sans Fallback,DejaVu Sans" font-size="16" fill="#334155">官方 RIPT-VLA 基础实现</text>
  <text x="60" y="540" font-family="Droid Sans Fallback,DejaVu Sans" font-size="14" fill="#64748b">范围：E2/E3 结果对应单个 LIBERO-Long 任务和一个训练 seed。</text>
</svg>
